name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: |
          cd ${{ github.workspace }}/projects
          npm run build
      - name: Publish to npm
        run: |
          cd ./dist/onlyoffice/document-editor-angular
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version)
          new_major=$(echo "$version" | cut -d. -f1)
          latest_major=$(echo "$latest" | cut -d. -f1)
          if [ "$new_major" -ge "$latest_major" ]; then
            npm publish --access public
          else
            npm publish --access public --tag backport
          fi
      - name: Get Info
        run: |
          cd ${{ github.workspace }}/projects/onlyoffice/document-editor-angular
          echo "version=$(grep -Eo '[0-9]+(\.[0-9]+)+' CHANGELOG.md | head -n 1)" >> $GITHUB_OUTPUT
        id: info
      - name: Generate Changelog
        run: |
          cd ${{ github.workspace }}/projects/onlyoffice/document-editor-angular
          awk '/## [0-9]/{p++} p; /## [0-9]/{if (p > 1) exit}' CHANGELOG.md | awk 'NR>2 {print last} {last=$0}' > RELEASE.md
      - name: Create Release
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          bodyFile: ${{ github.workspace }}/projects/onlyoffice/document-editor-angular/RELEASE.md
          tag: v${{ steps.info.outputs.version }}
